[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autohub"
version = "2.0.0"
description = "Automotive intelligence platform: brochure ingestion, structured specifications, search and a grounded assistant."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119,<1",
    "uvicorn>=0.37",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy>=2.0.44,<2.1",
    "alembic>=1.18",
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.4",
    "argon2-cffi>=25.1",
    "bcrypt>=5.0",
    "python-jose>=3.5",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2",
    "requests>=2.32",
    "httpx>=0.28",
    "google-genai>=1.60",
    "pymupdf>=1.26",
    "playwright==1.58.0",
    "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[tool.setuptools.packages.find]
include = ["autohub*", "tools*"]
exclude = ["autohub.venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
    "integration: needs the PostgreSQL test database (docker compose up -d db)",
]
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "autohub/venv",
    "autohub/alembic/versions/045d1b03bb71_initial_postgres_migration.py",
    "frontend",
    # Design docs contain illustrative snippets, not code to lint.
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is the framework's idiom
    "RUF012", # SQLAlchemy/pydantic class attributes
    "E501",   # the formatter owns line length; what remains is unsplittable string literals
    "RUF001", # en dashes in user-facing range strings ("10–12 km/l") are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["autohub/venv/", "autohub/alembic/", "frontend/"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "apscheduler.*", "jose.*", "fitz.*", "pymupdf.*", "playwright.*"]
ignore_missing_imports = true
